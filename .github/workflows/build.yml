name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Creer le projet Android
        run: |
          mkdir -p app/src/main/java/com/example/dynamicisland
          cat > settings.gradle.kts << 'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DynamicIsland"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts << 'EOF_FILE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF_FILE
          cat > gradle.properties << 'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > app/build.gradle.kts << 'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.dynamicisland"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.dynamicisland"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />

              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />

              <application
                  android:label="Dynamic Island"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".IslandService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay" />
                  </service>

                  <service
                      android:name=".NotifListener"
                      android:exported="true"
                      android:label="Dynamic Island"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/java/com/example/dynamicisland/MainActivity.kt << 'EOF_FILE'
          package com.example.dynamicisland

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class MainActivity : Activity() {

              private class Slider(
                  val key: String,
                  val label: String,
                  val min: Int,
                  val max: Int,
                  val def: Int
              )

              private val sliders = listOf(
                  Slider("y", "Position verticale", 0, 120, IslandService.DEF_Y),
                  Slider("x", "Position horizontale", -200, 200, IslandService.DEF_X),
                  Slider("w", "Largeur au repos", 60, 260, IslandService.DEF_W),
                  Slider("h", "Hauteur au repos", 20, 70, IslandService.DEF_H)
              )
              private val bars = HashMap<String, SeekBar>()
              private val labels = HashMap<String, TextView>()
              private lateinit var prefs: SharedPreferences

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun button(label: String, onClick: () -> Unit) = Button(this).apply {
                  this.text = label
                  setOnClickListener { onClick() }
              }

              private fun text(label: String, size: Float) = TextView(this).apply {
                  this.text = label
                  textSize = size
                  setPadding(0, dp(12), 0, dp(4))
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences(IslandService.PREFS, MODE_PRIVATE)

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(24), dp(20), dp(24))
                  }

                  col.addView(text("Dynamic Island", 26f).apply { gravity = Gravity.CENTER })
                  col.addView(button("Activer") { start() })
                  col.addView(button("Désactiver") {
                      stopService(Intent(this, IslandService::class.java))
                  })

                  col.addView(text("Position et taille (aperçu en direct)", 18f))
                  for (s in sliders) {
                      val label = TextView(this)
                      val bar = SeekBar(this).apply {
                          max = s.max - s.min
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(b: SeekBar, p: Int, fromUser: Boolean) {
                                  val v = s.min + p
                                  label.text = "${s.label} : $v dp"
                                  if (fromUser) prefs.edit().putInt(s.key, v).apply()
                              }
                              override fun onStartTrackingTouch(b: SeekBar) {}
                              override fun onStopTrackingTouch(b: SeekBar) {}
                          })
                      }
                      labels[s.key] = label
                      bars[s.key] = bar
                      col.addView(label)
                      col.addView(
                          bar,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                      )
                  }
                  col.addView(button("Réinitialiser la position") {
                      val e = prefs.edit()
                      for (s in sliders) e.putInt(s.key, s.def)
                      e.apply()
                      refreshBars()
                  })

                  col.addView(text("Musique et minuteur", 18f))
                  col.addView(
                      TextView(this).apply {
                          text = "Pour le lecteur musical et la détection du minuteur de l'appli Horloge, " +
                              "autorise l'accès aux notifications de « Dynamic Island »."
                      }
                  )
                  col.addView(button("Autoriser l'accès aux notifications") {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  })
                  col.addView(
                      TextView(this).apply {
                          text = "Si l'option est grisée (Android 13+) : Réglages › Applications › Dynamic Island " +
                              "› menu ⋮ › « Autoriser les paramètres restreints », puis recommence."
                          textSize = 12f
                          setPadding(0, dp(8), 0, 0)
                      }
                  )

                  setContentView(ScrollView(this).apply { addView(col) })
                  refreshBars()
              }

              private fun refreshBars() {
                  for (s in sliders) {
                      val v = prefs.getInt(s.key, s.def)
                      bars[s.key]?.progress = v - s.min
                      labels[s.key]?.text = "${s.label} : $v dp"
                  }
              }

              private fun start() {
                  // 1) Affichage par-dessus les autres applications
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                      return
                  }
                  // 2) Permissions runtime (nom du Wi-Fi, nom Bluetooth, notification du service)
                  val wanted = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION)
                  if (Build.VERSION.SDK_INT >= 31) wanted += Manifest.permission.BLUETOOTH_CONNECT
                  if (Build.VERSION.SDK_INT >= 33) wanted += Manifest.permission.POST_NOTIFICATIONS
                  val missing = wanted.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) {
                      requestPermissions(missing.toTypedArray(), 1)
                      return
                  }
                  launchService()
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  launchService() // démarre même si une permission est refusée (fonctions partielles)
              }

              private fun launchService() {
                  startForegroundService(Intent(this, IslandService::class.java))
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/example/dynamicisland/IslandService.kt << 'EOF_FILE'
          package com.example.dynamicisland

          import android.animation.ValueAnimator
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.bluetooth.BluetoothDevice
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.ServiceInfo
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.NetworkRequest
          import android.net.wifi.WifiInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.service.notification.StatusBarNotification
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.GestureDetector
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.WindowManager
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.OvershootInterpolator
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView

          class IslandService : Service() {

              companion object {
                  @Volatile
                  var instance: IslandService? = null

                  const val PREFS = "island"
                  const val DEF_W = 126
                  const val DEF_H = 36
                  const val DEF_Y = 10
                  const val DEF_X = 0

                  private const val CLOCK_SIDE = 66 // largeur ajoutée de chaque côté quand un minuteur tourne (dp)
                  private val YELLOW = Color.rgb(255, 214, 10)
                  private val TIME_RE = Regex("""\d{1,2}(:\d{2}){1,2}""")
              }

              private enum class Mode { IDLE, EVENT, TORCH, MUSIC }

              private val ui = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager
              private lateinit var wlp: WindowManager.LayoutParams
              private lateinit var root: FrameLayout
              private lateinit var island: FrameLayout
              private lateinit var bg: GradientDrawable
              private lateinit var eventText: TextView
              private lateinit var torchPanel: LinearLayout
              private lateinit var torchBtn: TextView
              private lateinit var seek: SeekBar
              private lateinit var musicPanel: LinearLayout
              private lateinit var musicArt: ImageView
              private lateinit var musicTitle: TextView
              private lateinit var musicArtist: TextView
              private lateinit var btnPlay: TextView
              private lateinit var clockIcon: TextView
              private lateinit var clockTime: TextView

              private var mode = Mode.IDLE
              private var anim: ValueAnimator? = null
              private val collapseRunnable = Runnable { collapse() }

              // Réglages (position / taille)
              private lateinit var prefs: SharedPreferences
              private var idleW = DEF_W
              private var idleH = DEF_H
              private var offY = DEF_Y
              private var offX = DEF_X
              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { _, _ ->
                  loadPrefs()
                  applyPosition()
              }

              // Lampe torche
              private lateinit var cm: CameraManager
              private var camId: String? = null
              private var torchOn = false
              private var maxLevel = 1
              private var level = 1

              // Réseau
              private lateinit var conn: ConnectivityManager
              private var lastSsid: String? = null

              // Musique
              private var msm: MediaSessionManager? = null
              private var sessionListener: MediaSessionManager.OnActiveSessionsChangedListener? = null
              private var mediaControllers: List<MediaController> = emptyList()
              private var mediaCtl: MediaController? = null
              private var lastTrackKey: String? = null
              private val mediaCb = object : MediaController.Callback() {
                  override fun onPlaybackStateChanged(state: PlaybackState?) = refreshMedia()
                  override fun onMetadataChanged(metadata: MediaMetadata?) = refreshMedia()
              }

              // Minuteur / chronomètre (appli Horloge)
              private var clockActive = false
              private var clockKey: String? = null
              private var clockChrono = false
              private var clockDown = false
              private var clockBase = 0L
              private var clockStatic: String? = null
              private var clockPending: PendingIntent? = null
              private val clockTick = object : Runnable {
                  override fun run() {
                      updateClockText()
                      if (clockActive) ui.postDelayed(this, 500)
                  }
              }

              // ---------------------------------------------------------------- cycle de vie

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE)
                  loadPrefs()
                  startInForeground()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  buildIsland()
                  setupTorch()
                  setupWifi()
                  setupBluetooth()
                  setupMedia()
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int) = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  instance = null
                  ui.removeCallbacksAndMessages(null)
                  prefs.unregisterOnSharedPreferenceChangeListener(prefListener)
                  try { conn.unregisterNetworkCallback(netCb) } catch (e: Exception) {}
                  try { unregisterReceiver(btReceiver) } catch (e: Exception) {}
                  try { sessionListener?.let { msm?.removeOnActiveSessionsChangedListener(it) } } catch (e: Exception) {}
                  for (c in mediaControllers) {
                      try { c.unregisterCallback(mediaCb) } catch (e: Exception) {}
                  }
                  try { wm.removeView(root) } catch (e: Exception) {}
                  super.onDestroy()
              }

              private fun startInForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("island", "Dynamic Island", NotificationManager.IMPORTANCE_MIN)
                  )
                  val n = Notification.Builder(this, "island")
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .setContentTitle("Dynamic Island active")
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
              }

              // ---------------------------------------------------------------- réglages

              private fun loadPrefs() {
                  idleW = prefs.getInt("w", DEF_W)
                  idleH = prefs.getInt("h", DEF_H)
                  offY = prefs.getInt("y", DEF_Y)
                  offX = prefs.getInt("x", DEF_X)
              }

              private fun applyPosition() {
                  wlp.x = dp(offX)
                  wlp.y = dp(offY)
                  try { wm.updateViewLayout(root, wlp) } catch (e: Exception) {}
                  if (mode == Mode.IDLE) restPill(false)
              }

              // ---------------------------------------------------------------- UI

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun dpf(v: Int) = v * resources.displayMetrics.density

              private fun ctrlButton(label: String, onClick: () -> Unit) = TextView(this).apply {
                  text = label
                  textSize = 24f
                  setTextColor(Color.WHITE)
                  gravity = Gravity.CENTER
                  setPadding(dp(24), dp(4), dp(24), dp(4))
                  setOnClickListener { onClick(); resetCollapse() }
              }

              private fun buildIsland() {
                  bg = GradientDrawable().apply {
                      setColor(Color.BLACK)
                      cornerRadius = dpf(idleH / 2)
                  }

                  // --- évènements Wi-Fi / Bluetooth
                  eventText = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      gravity = Gravity.CENTER
                      setPadding(dp(16), 0, dp(16), 0)
                      visibility = View.GONE
                  }

                  // --- lampe torche
                  val title = TextView(this).apply {
                      text = "��  Lampe torche"
                      setTextColor(Color.WHITE)
                      textSize = 16f
                  }
                  torchBtn = TextView(this).apply {
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(dp(18), dp(8), dp(18), dp(8))
                      background = GradientDrawable().apply { cornerRadius = dpf(100) }
                      setOnClickListener { setTorch(!torchOn); resetCollapse() }
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(title, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      addView(torchBtn)
                  }
                  seek = SeekBar(this).apply {
                      progressTintList = ColorStateList.valueOf(YELLOW)
                      thumbTintList = ColorStateList.valueOf(YELLOW)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar, p: Int, fromUser: Boolean) {
                              if (!fromUser) return
                              level = p + 1
                              if (torchOn) setTorch(true)
                              resetCollapse()
                          }
                          override fun onStartTrackingTouch(s: SeekBar) { resetCollapse() }
                          override fun onStopTrackingTouch(s: SeekBar) { resetCollapse() }
                      })
                  }
                  torchPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(20), dp(16), dp(20), dp(16))
                      visibility = View.GONE
                      addView(header)
                      addView(
                          seek,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply { topMargin = dp(12) }
                      )
                  }

                  // --- lecteur musical
                  musicArt = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      setBackgroundColor(Color.rgb(44, 44, 46))
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, dpf(12))
                          }
                      }
                  }
                  musicTitle = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                  }
                  musicArtist = TextView(this).apply {
                      setTextColor(Color.rgb(174, 174, 178))
                      textSize = 13f
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                  }
                  val texts = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(musicTitle)
                      addView(musicArtist)
                  }
                  val musicTop = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(musicArt, LinearLayout.LayoutParams(dp(56), dp(56)))
                      addView(
                          texts,
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                              .apply { marginStart = dp(12) }
                      )
                  }
                  btnPlay = ctrlButton("▶") {
                      val ctl = mediaCtl
                      if (ctl != null) {
                          if (ctl.playbackState?.state == PlaybackState.STATE_PLAYING) {
                              ctl.transportControls.pause()
                          } else {
                              ctl.transportControls.play()
                          }
                      }
                  }
                  val controls = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      addView(ctrlButton("◀◀") { mediaCtl?.transportControls?.skipToPrevious() })
                      addView(btnPlay)
                      addView(ctrlButton("▶▶") { mediaCtl?.transportControls?.skipToNext() })
                  }
                  musicPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(10))
                      visibility = View.GONE
                      addView(musicTop)
                      addView(
                          controls,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply { topMargin = dp(8) }
                      )
                  }

                  // --- minuteur / chronomètre (à gauche et à droite de la caméra)
                  clockIcon = TextView(this).apply {
                      text = "⏱"
                      textSize = 14f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      setOnClickListener { openClock() }
                  }
                  clockTime = TextView(this).apply {
                      textSize = 14f
                      setTextColor(YELLOW)
                      gravity = Gravity.CENTER
                      maxLines = 1
                      visibility = View.GONE
                      setOnClickListener { openClock() }
                  }

                  island = FrameLayout(this).apply {
                      background = bg
                      addView(eventText, FrameLayout.LayoutParams(-1, -1))
                      addView(torchPanel, FrameLayout.LayoutParams(-1, -1))
                      addView(musicPanel, FrameLayout.LayoutParams(-1, -1))
                      addView(
                          clockIcon,
                          FrameLayout.LayoutParams(dp(CLOCK_SIDE), -1, Gravity.START or Gravity.CENTER_VERTICAL)
                      )
                      addView(
                          clockTime,
                          FrameLayout.LayoutParams(dp(CLOCK_SIDE), -1, Gravity.END or Gravity.CENTER_VERTICAL)
                      )
                  }

                  // Gestes : appui maintenu = lampe torche, tap = musique / fermer
                  val gd = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent) = true
                      override fun onLongPress(e: MotionEvent) {
                          island.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                          onLongPressIsland()
                      }
                      override fun onSingleTapUp(e: MotionEvent): Boolean {
                          if (mode != Mode.IDLE) collapse() else showMusic(false)
                          return true
                      }
                  })
                  island.setOnTouchListener { _, e -> gd.onTouchEvent(e) }

                  root = FrameLayout(this).apply {
                      addView(
                          island,
                          FrameLayout.LayoutParams(dp(idleW), dp(idleH), Gravity.CENTER_HORIZONTAL)
                      )
                  }

                  wlp = WindowManager.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      x = dp(offX)
                      y = dp(offY)
                      if (Build.VERSION.SDK_INT >= 28) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  wm.addView(root, wlp)
                  updateTorchUi()
              }

              private fun animateTo(wDp: Int, hDp: Int, rDp: Int) {
                  anim?.cancel()
                  val lp = island.layoutParams
                  val w0 = lp.width
                  val h0 = lp.height
                  val r0 = bg.cornerRadius
                  val w1 = dp(wDp)
                  val h1 = dp(hDp)
                  val r1 = dpf(rDp)
                  val grow = w1 >= w0 && h1 >= h0
                  anim = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = if (grow) 420 else 300
                      interpolator = if (grow) OvershootInterpolator(0.9f) else DecelerateInterpolator()
                      addUpdateListener {
                          val t = it.animatedValue as Float
                          lp.width = (w0 + (w1 - w0) * t).toInt()
                          lp.height = (h0 + (h1 - h0) * t).toInt()
                          bg.cornerRadius = r0 + (r1 - r0) * t
                          island.layoutParams = lp
                      }
                      start()
                  }
              }

              private fun setSizeNow(wDp: Int, hDp: Int, rDp: Int) {
                  anim?.cancel()
                  val lp = island.layoutParams
                  lp.width = dp(wDp)
                  lp.height = dp(hDp)
                  bg.cornerRadius = dpf(rDp)
                  island.layoutParams = lp
              }

              /** Affiche un seul contenu dans l'île (null = aucun). */
              private fun showOnly(v: View?) {
                  for (c in listOf<View>(eventText, torchPanel, musicPanel)) {
                      c.animate().cancel()
                      c.visibility = if (c === v) View.VISIBLE else View.GONE
                  }
                  clockIcon.visibility = View.GONE
                  clockTime.visibility = View.GONE
                  if (v != null) {
                      v.alpha = 0f
                      v.animate().alpha(1f).setStartDelay(150).setDuration(200).start()
                  }
              }

              /** État de repos : pilule seule, ou pilule élargie avec le minuteur. */
              private fun restPill(animate: Boolean) {
                  val timer = clockActive
                  val vis = if (timer) View.VISIBLE else View.GONE
                  clockIcon.visibility = vis
                  clockTime.visibility = vis
                  val w = if (timer) idleW + 2 * CLOCK_SIDE else idleW
                  if (animate) animateTo(w, idleH, idleH / 2) else setSizeNow(w, idleH, idleH / 2)
              }

              private fun showEvent(text: String) {
                  if (mode == Mode.TORCH) return // on ne dérange pas le contrôle de la lampe
                  ui.removeCallbacks(collapseRunnable)
                  mode = Mode.EVENT
                  eventText.text = text
                  showOnly(eventText)
                  val wDp = (eventText.paint.measureText(text) / resources.displayMetrics.density).toInt() + 56
                  animateTo(wDp.coerceIn(160, 340), 48, 24)
                  ui.postDelayed(collapseRunnable, 3500)
              }

              private fun showTorchPanel() {
                  ui.removeCallbacks(collapseRunnable)
                  mode = Mode.TORCH
                  showOnly(torchPanel)
                  animateTo(320, if (maxLevel > 1) 120 else 80, 32)
                  ui.postDelayed(collapseRunnable, 6000)
              }

              private fun showMusic(auto: Boolean) {
                  if (mode == Mode.TORCH || mediaCtl == null) return
                  ui.removeCallbacks(collapseRunnable)
                  mode = Mode.MUSIC
                  showOnly(musicPanel)
                  animateTo(330, 140, 34)
                  ui.postDelayed(collapseRunnable, if (auto) 4500 else 7000)
              }

              private fun collapse() {
                  ui.removeCallbacks(collapseRunnable)
                  mode = Mode.IDLE
                  showOnly(null)
                  restPill(true)
              }

              private fun resetCollapse() {
                  if (mode != Mode.TORCH && mode != Mode.MUSIC) return
                  ui.removeCallbacks(collapseRunnable)
                  ui.postDelayed(collapseRunnable, 6000)
              }

              private fun onLongPressIsland() {
                  if (mode == Mode.TORCH) return
                  if (camId == null) {
                      showEvent("Pas de lampe torche")
                      return
                  }
                  if (!torchOn) setTorch(true)
                  showTorchPanel()
              }

              // ---------------------------------------------------------------- lampe torche

              private fun setupTorch() {
                  cm = getSystemService(CameraManager::class.java)
                  for (id in cm.cameraIdList) {
                      val ch = cm.getCameraCharacteristics(id)
                      val hasFlash = ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      val back = ch.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_BACK
                      if (hasFlash && back) {
                          camId = id
                          if (Build.VERSION.SDK_INT >= 33) {
                              maxLevel = ch.get(CameraCharacteristics.FLASH_INFO_STRENGTH_MAXIMUM_LEVEL) ?: 1
                              level = ch.get(CameraCharacteristics.FLASH_INFO_STRENGTH_DEFAULT_LEVEL) ?: 1
                          }
                          break
                      }
                  }
                  // Réglage d'intensité uniquement si le téléphone le supporte (Android 13+)
                  seek.visibility = if (maxLevel > 1) View.VISIBLE else View.GONE
                  seek.max = (maxLevel - 1).coerceAtLeast(1)
                  seek.progress = level - 1

                  cm.registerTorchCallback(object : CameraManager.TorchCallback() {
                      override fun onTorchModeChanged(id: String, enabled: Boolean) {
                          if (id != camId) return
                          torchOn = enabled
                          updateTorchUi()
                      }
                  }, ui)
              }

              private fun setTorch(on: Boolean) {
                  val id = camId ?: return
                  try {
                      if (on && Build.VERSION.SDK_INT >= 33 && maxLevel > 1) {
                          cm.turnOnTorchWithStrengthLevel(id, level)
                      } else {
                          cm.setTorchMode(id, on)
                      }
                  } catch (e: Exception) {
                      // caméra utilisée par une autre app, etc.
                  }
              }

              private fun updateTorchUi() {
                  (torchBtn.background as GradientDrawable)
                      .setColor(if (torchOn) YELLOW else Color.rgb(58, 58, 60))
                  torchBtn.setTextColor(if (torchOn) Color.BLACK else Color.WHITE)
                  torchBtn.text = if (torchOn) "ON" else "OFF"
              }

              // ---------------------------------------------------------------- Wi-Fi

              private val netCb: ConnectivityManager.NetworkCallback by lazy {
                  if (Build.VERSION.SDK_INT >= 31) {
                      object : ConnectivityManager.NetworkCallback(ConnectivityManager.NetworkCallback.FLAG_INCLUDE_LOCATION_INFO) {
                          override fun onCapabilitiesChanged(n: Network, c: NetworkCapabilities) = onWifi(c)
                          override fun onLost(n: Network) { lastSsid = null }
                      }
                  } else {
                      object : ConnectivityManager.NetworkCallback() {
                          override fun onCapabilitiesChanged(n: Network, c: NetworkCapabilities) = onWifi(c)
                          override fun onLost(n: Network) { lastSsid = null }
                      }
                  }
              }

              private fun setupWifi() {
                  conn = getSystemService(ConnectivityManager::class.java)
                  val req = NetworkRequest.Builder()
                      .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                      .build()
                  conn.registerNetworkCallback(req, netCb)
              }

              @Suppress("DEPRECATION")
              private fun onWifi(c: NetworkCapabilities) {
                  val raw = if (Build.VERSION.SDK_INT >= 31) {
                      (c.transportInfo as? WifiInfo)?.ssid
                  } else {
                      (applicationContext.getSystemService(WIFI_SERVICE) as WifiManager).connectionInfo?.ssid
                  }
                  val ssid = raw?.trim('"') ?: return
                  if (ssid.isEmpty() || ssid == "<unknown ssid>" || ssid == lastSsid) return
                  lastSsid = ssid
                  ui.post { showEvent("��  $ssid") }
              }

              // ---------------------------------------------------------------- Bluetooth

              private val btReceiver = object : BroadcastReceiver() {
                  @Suppress("DEPRECATION")
                  override fun onReceive(c: Context, i: Intent) {
                      val dev = if (Build.VERSION.SDK_INT >= 33) {
                          i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE, BluetoothDevice::class.java)
                      } else {
                          i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                      }
                      val name = try { dev?.name } catch (e: SecurityException) { null } ?: "Appareil Bluetooth"
                      when (i.action) {
                          BluetoothDevice.ACTION_ACL_CONNECTED -> showEvent("��  $name")
                          BluetoothDevice.ACTION_ACL_DISCONNECTED -> showEvent("��  $name déconnecté")
                      }
                  }
              }

              private fun setupBluetooth() {
                  val filter = IntentFilter().apply {
                      addAction(BluetoothDevice.ACTION_ACL_CONNECTED)
                      addAction(BluetoothDevice.ACTION_ACL_DISCONNECTED)
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(btReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(btReceiver, filter)
                  }
              }

              // ---------------------------------------------------------------- musique

              /** Appelé aussi par NotifListener dès que l'accès aux notifications est actif. */
              fun onListenerReady() {
                  ui.post { setupMedia() }
              }

              private fun setupMedia() {
                  try {
                      val m = getSystemService(MediaSessionManager::class.java)
                      msm = m
                      val cn = ComponentName(this, NotifListener::class.java)
                      sessionListener?.let { m.removeOnActiveSessionsChangedListener(it) }
                      val l = MediaSessionManager.OnActiveSessionsChangedListener { list -> onSessions(list) }
                      sessionListener = l
                      m.addOnActiveSessionsChangedListener(l, cn, ui)
                      onSessions(m.getActiveSessions(cn))
                  } catch (e: SecurityException) {
                      // accès aux notifications pas encore accordé
                  }
              }

              private fun onSessions(list: List<MediaController>?) {
                  for (c in mediaControllers) {
                      try { c.unregisterCallback(mediaCb) } catch (e: Exception) {}
                  }
                  mediaControllers = list ?: emptyList()
                  for (c in mediaControllers) c.registerCallback(mediaCb, ui)
                  refreshMedia()
              }

              private fun refreshMedia() {
                  val pick = mediaControllers.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING }
                      ?: mediaControllers.firstOrNull()
                  mediaCtl = pick
                  if (pick == null) {
                      lastTrackKey = null
                      if (mode == Mode.MUSIC) collapse()
                      return
                  }
                  val md = pick.metadata
                  val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "Lecture en cours"
                  val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST)
                      ?: md?.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST) ?: ""
                  val art = md?.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)
                      ?: md?.getBitmap(MediaMetadata.METADATA_KEY_ART)
                      ?: md?.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON)
                  musicTitle.text = title
                  musicArtist.text = artist
                  if (art != null) musicArt.setImageBitmap(art) else musicArt.setImageDrawable(null)

                  val playing = pick.playbackState?.state == PlaybackState.STATE_PLAYING
                  btnPlay.text = if (playing) "❚❚" else "▶"
                  if (playing) {
                      val key = "$title|$artist"
                      val changed = key != lastTrackKey
                      lastTrackKey = key
                      if (changed && (mode == Mode.IDLE || mode == Mode.EVENT)) showMusic(true)
                  }
              }

              // ---------------------------------------------------------------- minuteur / chronomètre

              fun postClock(sbn: StatusBarNotification) {
                  ui.post { onClockPosted(sbn) }
              }

              fun postClockRemoved(sbn: StatusBarNotification) {
                  ui.post { onClockRemoved(sbn) }
              }

              private fun onClockPosted(sbn: StatusBarNotification) {
                  val n = sbn.notification
                  val ex = n.extras
                  val chrono = ex.getBoolean("android.showChronometer", false)
                  if (!chrono && !sbn.isOngoing) return

                  val txt = listOf(
                      Notification.EXTRA_TITLE, Notification.EXTRA_TEXT,
                      Notification.EXTRA_SUB_TEXT, Notification.EXTRA_BIG_TEXT
                  ).joinToString(" ") { ex.getCharSequence(it)?.toString() ?: "" }
                  val found = TIME_RE.find(txt)?.value
                  val useChrono = chrono && n.`when` > 0
                  if (!useChrono && found == null) return

                  clockKey = sbn.key
                  clockPending = n.contentIntent
                  clockChrono = useChrono
                  clockDown = ex.getBoolean("android.chronometerCountDown", false)
                  clockBase = n.`when`
                  clockStatic = found
                  clockIcon.text = if (useChrono && clockDown) "⏳" else "⏱"
                  updateClockText()

                  if (!clockActive) {
                      clockActive = true
                      ui.removeCallbacks(clockTick)
                      ui.post(clockTick)
                      if (mode == Mode.IDLE) restPill(true)
                  }
              }

              private fun onClockRemoved(sbn: StatusBarNotification) {
                  if (!clockActive || sbn.key != clockKey) return
                  val finished = clockChrono && clockDown && clockBase - System.currentTimeMillis() < 4000
                  clockActive = false
                  clockKey = null
                  ui.removeCallbacks(clockTick)
                  if (finished) {
                      showEvent("⏰  Minuteur terminé")
                  } else if (mode == Mode.IDLE) {
                      restPill(true)
                  }
              }

              private fun updateClockText() {
                  clockTime.text = if (clockChrono) {
                      val now = System.currentTimeMillis()
                      val ms = if (clockDown) clockBase - now else now - clockBase
                      fmt((ms.coerceAtLeast(0L)) / 1000)
                  } else {
                      clockStatic ?: "--:--"
                  }
              }

              private fun fmt(totalSec: Long): String {
                  val h = totalSec / 3600
                  val m = (totalSec % 3600) / 60
                  val s = totalSec % 60
                  return if (h > 0) "%d:%02d:%02d".format(h, m, s) else "%02d:%02d".format(m, s)
              }

              private fun openClock() {
                  try { clockPending?.send() } catch (e: PendingIntent.CanceledException) {}
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/example/dynamicisland/NotifListener.kt << 'EOF_FILE'
          package com.example.dynamicisland

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          /**
           * Sert à deux choses :
           *  - donner à Android l'autorisation de lire les sessions média (lecteur musical)
           *  - repérer les notifications de l'appli Horloge (minuteur / chronomètre)
           */
          class NotifListener : NotificationListenerService() {

              private val clockPackages = setOf(
                  "com.sec.android.app.clockpackage", // Horloge Samsung
                  "com.google.android.deskclock"      // Horloge Google
              )

              override fun onListenerConnected() {
                  IslandService.instance?.onListenerReady()
                  try {
                      activeNotifications?.forEach { handle(it, true) }
                  } catch (e: Exception) {
                  }
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) = handle(sbn, true)

              override fun onNotificationRemoved(sbn: StatusBarNotification) = handle(sbn, false)

              private fun handle(sbn: StatusBarNotification, posted: Boolean) {
                  if (sbn.packageName !in clockPackages) return
                  val island = IslandService.instance ?: return
                  if (posted) island.postClock(sbn) else island.postClockRemoved(sbn)
              }
          }
          EOF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compiler
        run: gradle assembleDebug --no-daemon
      - name: Publier l'APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dynamic Island build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
